name: Update CMI data (ทั้งประเทศ)

on:
  schedule:
    # วันละ 2 รอบ (เวลาไทย 07:23 และ 19:23) ดึงปีงบปัจจุบัน · ทุกวันอาทิตย์รอบเช้าดึงปีงบก่อนหน้าด้วย
    - cron: "23 0,12 * * *"
  workflow_dispatch:
    inputs:
      fy:
        description: "ปีงบประมาณ พ.ศ. คั่นด้วยช่องว่าง (เว้นว่าง = ปีงบปัจจุบัน)"
        required: false
      regions:
        description: "เขตที่ดึง เช่น 0-12 หรือ 1,2 (0 = ภาพรวมประเทศ)"
        required: false
        default: "0-12"

permissions:
  contents: write

concurrency:
  group: update-cmi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 lxml openpyxl

      - name: Probe cmi.moph.go.th (ลองซ้ำสูงสุด 4 ครั้ง)
        run: |
          for i in 1 2 3 4; do
            if timeout 120 python scripts/fetch_cmi.py --probe; then echo "OK=1" >> $GITHUB_ENV; exit 0; fi
            echo "ครั้งที่ $i เข้าเว็บ CMI ไม่ได้ รอ 2 นาที"; sleep 120
          done
          echo "::warning::รอบนี้เข้าเว็บ cmi.moph.go.th ไม่ได้ ข้ามไป ข้อมูลเดิมยังอยู่"

      - name: Fetch + build
        if: env.OK == '1'
        env:
          FY_IN: ${{ github.event.inputs.fy }}
          REG_IN: ${{ github.event.inputs.regions }}
        run: |
          CUR=$(( $(TZ=Asia/Bangkok date +%Y) + 543 + ( $(TZ=Asia/Bangkok date +%-m) >= 10 ? 1 : 0 ) ))
          if [ -n "$FY_IN" ]; then LIST="$FY_IN"
          elif [ "$(TZ=Asia/Bangkok date +%u%H)" = "707" ]; then LIST="$CUR $((CUR-1))"
          else LIST="$CUR"; fi
          REGS="${REG_IN:-0-12}"
          for FY in $LIST; do
            python scripts/fetch_cmi.py --fy "$FY" --regions "$REGS" --out "/tmp/cmi" --workers 4
            python scripts/build_data.py --raw /tmp/cmi --fy "$FY"
          done

      - name: Keep raw files (3 วัน สำหรับตรวจสอบ)
        if: env.OK == '1'
        uses: actions/upload-artifact@v4
        with:
          name: cmi-raw
          path: /tmp/cmi/*.json
          retention-days: 3

      - name: Commit if changed
        if: env.OK == '1'
        run: |
          git config user.name  "cmi-bot"
          git config user.email "cmi-bot@users.noreply.github.com"
          git add years.json meta.json data
          if git diff --cached --quiet; then echo "ข้อมูลไม่เปลี่ยน"; exit 0; fi
          git commit -q -m "update CMI data $(TZ=Asia/Bangkok date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
